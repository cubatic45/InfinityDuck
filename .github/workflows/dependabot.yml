name: Update official dae release

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-official-dae
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out InfinityDuck
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check official stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current=$(sed -n 's/^DAE_VERSION:=//p' duck/Makefile)
          release=$(gh api repos/daeuniverse/dae/releases/latest)
          tag=$(jq -r .tag_name <<< "$release")
          latest=${tag#v}
          published_at=$(jq -r .published_at <<< "$release")
          release_date=${published_at%%T*}
          release_date=${release_date//-/.}

          digest_url="https://github.com/daeuniverse/dae/releases/download/${tag}/dae-full-src.tar.xz.dgst"
          hash=$(curl --fail --location --retry 3 "$digest_url" |
            awk '$2 == "dae-full-src.tar.xz" && $3 == "sha256" { print $1 }')

          [[ $latest =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ $release_date =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]
          [[ $hash =~ ^[0-9a-f]{64}$ ]]

          {
            echo "current=$current"
            echo "latest=$latest"
            echo "release_date=$release_date"
            echo "hash=$hash"
          } >> "$GITHUB_OUTPUT"

          if [[ $current == "$latest" ]]; then
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update official dae release
        if: steps.release.outputs.update == 'true'
        env:
          DAE_VERSION: ${{ steps.release.outputs.latest }}
          DAE_RELEASE_DATE: ${{ steps.release.outputs.release_date }}
          DAE_HASH: ${{ steps.release.outputs.hash }}
        run: |
          set -euo pipefail
          sed -i "s/^DAE_VERSION:=.*/DAE_VERSION:=${DAE_VERSION}/" duck/Makefile
          sed -i "s/^DAE_RELEASE_DATE:=.*/DAE_RELEASE_DATE:=${DAE_RELEASE_DATE}/" duck/Makefile
          sed -i 's/^PKG_RELEASE:=.*/PKG_RELEASE:=1/' duck/Makefile
          sed -i "s/^PKG_HASH:=.*/PKG_HASH:=${DAE_HASH}/" duck/Makefile
          sed -i "s/^expected_dae_version=.*/expected_dae_version=${DAE_VERSION}/" duck/test.sh
          bash scripts/apk/verify-upstream.sh

      - name: Create update pull request
        if: steps.release.outputs.update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/official-dae-release
          delete-branch: true
          commit-message: "build: update official dae to v${{ steps.release.outputs.latest }}"
          title: "build: update official dae to v${{ steps.release.outputs.latest }}"
          body: |
            Update the packaged core to the latest stable release from
            [daeuniverse/dae](https://github.com/daeuniverse/dae).

            [Changes](https://github.com/daeuniverse/dae/compare/v${{ steps.release.outputs.current }}...v${{ steps.release.outputs.latest }})
