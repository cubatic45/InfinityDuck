name: Editor regression tests
on:
  push:
    paths:
      - 'luci-app-duck/**'
      - 'duck/**'
      - 'scripts/editor/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/editor.yml'
  pull_request:
    paths:
      - 'luci-app-duck/**'
      - 'duck/**'
      - 'scripts/editor/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/editor.yml'
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y busybox jq
      - run: npm ci
      - run: npm run build:editor
      - name: Check committed editor assets match the locked dependencies
        run: git diff --exit-code -- luci-app-duck/htdocs/luci-static/resources/monaco-editor
      - run: busybox ash -n duck/files/duck.init && busybox ash -n luci-app-duck/root/usr/libexec/rpcd/duck.config
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
