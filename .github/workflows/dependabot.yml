name: Update kdae source

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-kdae
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out InfinityDuck
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check kdae branch
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(sed -n 's/^PKG_SOURCE_VERSION:=//p' duck/Makefile)
          latest=$(gh api repos/olicesx/dae/branches/kdae --jq .commit.sha)
          [[ $latest =~ ^[0-9a-f]{40}$ ]]
          {
            echo "current=$current"
            echo "latest=$latest"
            echo "version=$(date -u +%Y.%m.%d)"
            if [[ $current == "$latest" ]]; then
              echo "update=false"
            else
              echo "update=true"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Update pinned kdae source and checksum
        if: steps.source.outputs.update == 'true'
        env:
          KDAE_COMMIT: ${{ steps.source.outputs.latest }}
          KDAE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          hash=$(bash scripts/apk/kdae-source-hash.sh "$KDAE_VERSION" "$KDAE_COMMIT")
          [[ $hash =~ ^[0-9a-f]{64}$ ]]
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${KDAE_VERSION}/" duck/Makefile
          sed -i 's/^PKG_RELEASE:=.*/PKG_RELEASE:=1/' duck/Makefile
          sed -i "s/^PKG_SOURCE_VERSION:=.*/PKG_SOURCE_VERSION:=${KDAE_COMMIT}/" duck/Makefile
          sed -i "s/^PKG_MIRROR_HASH:=.*/PKG_MIRROR_HASH:=${hash}/" duck/Makefile
          sed -i "s/^expected_dae_version=.*/expected_dae_version=${KDAE_VERSION}/" duck/test.sh

      - name: Create update pull request
        if: steps.source.outputs.update == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: automation/kdae-source
          delete-branch: true
          commit-message: "build: update kdae to ${{ steps.source.outputs.latest }}"
          title: "build: update kdae to ${{ steps.source.outputs.latest }}"
          body: |
            Update the pinned core from the kdae branch of
            [olicesx/dae](https://github.com/olicesx/dae/tree/kdae).
            Regenerate the OpenWrt source archive checksum, including submodules.

            [Changes](https://github.com/olicesx/dae/compare/${{ steps.source.outputs.current }}...${{ steps.source.outputs.latest }})
